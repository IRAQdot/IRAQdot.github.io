name: Build Android APK (IRAQdot)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Capacitor Configuration
        run: |
          mkdir -p www
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name 'www' -exec cp -r {} www/ \;
          cat << 'EOF' > package.json
          {
            "name": "iraqdot-news",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.iraqdot.news",
            "appName": "IRAQdot",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npm install

      - name: Generate Android Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Debug APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRAQdot-News-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
