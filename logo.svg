<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- التدرجات اللونية للأيقونة والنصوص -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003B73" />
      <stop offset="100%" stop-color="#00A86B" />
    </linearGradient>
    
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002B5B" />
      <stop offset="100%" stop-color="#005691" />
    </linearGradient>

    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A86B" />
      <stop offset="100%" stop-color="#02C39A" />
    </linearGradient>
    
    <!-- نمط خلفية الشبكة الخفيفة -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#EAEAEA" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- الخلفية -->
  <rect width="800" height="500" fill="#FAFAFA" />
  <rect width="800" height="500" fill="url(#grid)" opacity="0.5" />

  <!-- مجموع الأيقونة الدائرية -->
  <g transform="translate(400, 160)">
    <!-- الإطار الخارجي الدائري -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="url(#primary-grad)" stroke-width="12" />
    <circle cx="0" cy="0" r="76" fill="none" stroke="#003B73" stroke-width="3" opacity="0.3" />
    
    <!-- خطوط الكرة الأرضية والشبكة الإخبارية -->
    <path d="M -70 0 A 70 70 0 0 0 70 0 Z" fill="none" stroke="#005691" stroke-width="3" opacity="0.25" />
    <ellipse cx="0" cy="0" rx="40" ry="75" fill="none" stroke="#005691" stroke-width="3" opacity="0.3" />
    
    <!-- أسهم النمو والتغطية الإخبارية -->
    <path d="M -45 45 L -20 -10 M -20 -10 L -32 -8 M -20 -10 L -18 -22" fill="none" stroke="#005691" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -30 55 L 0 5 M 0 5 L -10 6 M 0 5 L -1 16" fill="none" stroke="#00A86B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- إشارات البث الرقمي (Wi-Fi / Signal) -->
    <path d="M 30 -35 A 25 25 0 0 1 50 -15" fill="none" stroke="#00A86B" stroke-width="5" stroke-linecap="round" />
    <path d="M 22 -45 A 40 40 0 0 1 62 -5" fill="none" stroke="#003B73" stroke-width="5" stroke-linecap="round" />

    <!-- حرف "ع" المركز الفني -->
    <path d="M -15 -25 C -5 -42 25 -35 20 -15 C 15 -2 5 5 -10 15 C -25 25 -35 45 -45 65" fill="none" stroke="url(#blue-grad)" stroke-width="14" stroke-linecap="round" />
    <!-- نقطة حرف العين دلالة على "دوت" -->
    <circle cx="20" cy="-42" r="7" fill="#00A86B" />
  </g>

  <!-- النص العربي: عراق . دوت -->
  <g transform="translate(400, 340)" text-anchor="middle" font-family="'Segoe UI', 'Cairo', 'Tajawal', sans-serif" font-weight="900">
    <!-- كلمة "عراق" باللون الأزرق الداكن -->
    <text x="75" y="0" font-size="70" fill="url(#blue-grad)" letter-spacing="1">عراق</text>
    
    <!-- النقطة الفاصلة باللون الأخضر -->
    <circle cx="0" cy="-15" r="10" fill="#00A86B" />
    
    <!-- كلمة "دوت" باللون الأخضر التفاعلي -->
    <text x="-95" y="0" font-size="70" fill="url(#green-grad)" letter-spacing="1">دوت</text>
  </g>

  <!-- النص الإنجليزي الفرعي: IRAQ.NEWS -->
  <g transform="translate(400, 410)" text-anchor="middle" font-family="'Montserrat', 'Arial', sans-serif" font-weight="700">
    <text x="0" y="0" font-size="28" fill="#555555" letter-spacing="12">IRAQ.NEWS</text>
  </g>
</svg>
