<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دخول</title>
</head>
<body style="text-align:center; padding:50px; font-family:Arial;">
    <h2>أدخل التوكن</h2>
    <input type="password" id="t" placeholder="التوكن" style="padding:10px; font-size:18px;">
    <button onclick="f()" style="padding:10px 20px; font-size:18px; cursor:pointer;">دخول</button>
    <p id="r"></p>
    <script>
        function f() {
            var x = document.getElementById('t').value;
            if (x === 'iraqdot2025') {
                document.getElementById('r').innerHTML = '✅ صحيح! مرحبًا بك';
                document.getElementById('r').style.color = 'green';
            } else {
                document.getElementById('r').innerHTML = '❌ خطأ! التوكن الذي أدخلته: ' + x;
                document.getElementById('r').style.color = 'red';
            }
        }
    </script>
</body>
</html>
