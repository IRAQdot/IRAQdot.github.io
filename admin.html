<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | عراق دوت IRAQdot</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary: #0d6efd;
            --primary-dark: #0a58ca;
            --dark: #212529;
            --light: #f8f9fa;
            --white: #fff;
            --danger: #dc3545;
            --success: #198754;
            --warning: #ffc107;
            --font: 'Cairo', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font); background: #f0f2f5; min-height: 100vh; padding: 20px; }

        .login-box {
            background: #fff; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 50px 40px; text-align: center; max-width: 450px; margin: 80px auto;
        }
        .login-box h2 { font-size: 2rem; font-weight: 900; margin-bottom: 10px; }
        .login-box .sub { color: #666; margin-bottom: 30px; }
        .login-box input {
            width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 12px;
            font-size: 1.1rem; text-align: center; font-family: inherit;
            margin-bottom: 20px; direction: ltr; transition: all 0.3s;
        }
        .login-box input:focus { border-color: var(--primary); outline: none; }
        .login-box button {
            width: 100%; padding: 15px; background: var(--primary); color: #fff;
            border: none; border-radius: 12px; font-size: 1.2rem; font-weight: 800;
            cursor: pointer; font-family: inherit; transition: all 0.3s;
        }
        .login-box button:hover { background: var(--primary-dark); }
        .error { color: var(--danger); margin-top: 15px; display: none; font-weight: 700; }

        .dashboard { display: none; max-width: 1200px; margin: 0 auto; }
        .dash-header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff; border-radius: 20px; padding: 25px 30px;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 15px; margin-bottom: 25px;
        }
        .dash-header h1 { font-size: 1.5rem; font-weight: 900; }
        .logout-btn {
            background: rgba(255,255,255,0.15); color: #fff;
            border: 1px solid rgba(255,255,255,0.3); padding: 10px 25px;
            border-radius: 30px; cursor: pointer; font-family: inherit;
            font-weight: 700; font-size: 0.95rem; transition: all 0.3s;
        }
        .logout-btn:hover { background: rgba(255,255,255,0.3); }

        .stats-row {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px; margin-bottom: 25px;
        }
        .stat-card {
            background: #fff; border-radius: 15px; padding: 25px;
            text-align: center; box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }
        .stat-card .num { font-size: 2.2rem; font-weight: 900; color: var(--primary); }
        .stat-card .lbl { color: #666; font-weight: 600; }

        .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .panel {
            background: #fff; border-radius: 20px; padding: 25px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }
        .panel h3 { font-size: 1.3rem; font-weight: 900; margin-bottom: 20px; }

        .cat-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .cat-btn {
            padding: 10px 20px; border: 2px solid #ddd; border-radius: 30px;
            background: #fff; cursor: pointer; font-family: inherit;
            font-weight: 700; font-size: 0.9rem; transition: all 0.3s;
        }
        .cat-btn:hover { border-color: var(--primary); color: var(--primary); }
        .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; color: #333; }
        .form-group input[type="text"],
        .form-group input[type="date"],
        .form-group input[type="time"],
        .form-group textarea {
            width: 100%; padding: 12px 15px; border: 2px solid #ddd;
            border-radius: 10px; font-size: 1rem; font-family: inherit;
            transition: all 0.3s;
        }
        .form-group input:focus,
        .form-group textarea:focus { border-color: var(--primary); outline: none; }
        .form-group textarea { min-height: 120px; resize: vertical; line-height: 1.6; }

        .checkbox-group {
            display: flex; align-items: center; gap: 10px;
            background: #f8f9fa; padding: 15px; border-radius: 10px;
        }
        .checkbox-group input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
        .checkbox-group label { margin: 0; cursor: pointer; }

        .toolbar {
            display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;
            padding: 10px; background: #f8f9fa; border-radius: 10px;
        }
        .toolbar button {
            padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px;
            background: #fff; cursor: pointer; font-family: inherit;
            font-size: 0.9rem; font-weight: 600; transition: all 0.2s;
        }
        .toolbar button:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

        .editor {
            min-height: 200px; border: 2px solid #ddd; border-radius: 10px;
            padding: 15px; font-size: 1rem; line-height: 1.7;
            outline: none; overflow-y: auto;
        }
        .editor:focus { border-color: var(--primary); }
        .editor img { max-width: 100%; border-radius: 10px; margin: 10px 0; }

        .upload-area {
            border: 2px dashed #ddd; border-radius: 15px; padding: 30px;
            text-align: center; cursor: pointer; transition: all 0.3s;
        }
        .upload-area:hover { border-color: var(--primary); background: rgba(13,110,253,0.03); }
        .upload-area .icon { font-size: 2.5rem; margin-bottom: 10px; }
        .upload-area p { color: #666; }

        .news-list { list-style: none; max-height: 600px; overflow-y: auto; }
        .news-item {
            background: #f8f9fa; border-radius: 12px; padding: 15px;
            margin-bottom: 10px; display: flex; justify-content: space-between;
            align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .news-item .info { flex: 1; }
        .news-item .info h4 { font-weight: 800; margin-bottom: 5px; font-size: 1rem; }
        .news-item .info .cat {
            font-size: 0.75rem; background: var(--primary); color: #fff;
            padding: 3px 12px; border-radius: 20px; display: inline-block;
        }
        .news-item .info .badge-urgent {
            font-size: 0.7rem; background: #dc3545; color: #fff;
            padding: 3px 10px; border-radius: 20px; display: inline-block;
            margin-right: 5px; animation: blink 1s infinite;
        }
        .news-item .actions { display: flex; gap: 8px; }
        .news-item .actions button {
            border: none; padding: 7px 14px; border-radius: 20px;
            cursor: pointer; font-family: inherit; font-weight: 700;
            font-size: 0.8rem; transition: all 0.2s;
        }
        .btn-edit { background: var(--warning); color: #212529; }
        .btn-del { background: var(--danger); color: #fff; }

        .btn-submit {
            width: 100%; padding: 15px; background: var(--success);
            color: #fff; border: none; border-radius: 12px;
            font-size: 1.1rem; font-weight: 800; cursor: pointer;
            font-family: inherit; transition: all 0.3s;
        }
        .btn-submit:hover { background: #146c43; }

        .loading { text-align: center; padding: 20px; color: #666; font-weight: 700; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        @media (max-width: 900px) {
            .content-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- ===== شاشة تسجيل الدخول ===== -->
    <div class="login-box" id="loginBox">
        <h2>🔐 لوحة التحكم</h2>
        <p class="sub">أدخل التوكن للوصول إلى الإدارة</p>
        <input type="password" id="tokenInput" placeholder="التوكن">
        <button onclick="login()">دخول</button>
        <p class="error" id="errorMsg">❌ التوكن غير صحيح</p>
    </div>

    <!-- ===== لوحة التحكم ===== -->
    <div class="dashboard" id="dashboard">
        <div class="dash-header">
            <h1>📊 لوحة تحكم عراق دوت IRAQdot</h1>
            <button class="logout-btn" onclick="logout()">🚪 تسجيل الخروج</button>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="num" id="totalNews">0</div>
                <div class="lbl">📰 إجمالي الأخبار</div>
            </div>
            <div class="stat-card">
                <div class="num" id="totalCats">0</div>
                <div class="lbl">📂 الأقسام</div>
            </div>
            <div class="stat-card">
                <div class="num" id="dbStatus">⏳</div>
                <div class="lbl">حالة قاعدة البيانات</div>
            </div>
        </div>

        <div class="content-grid">
            <!-- ===== إضافة / تعديل خبر ===== -->
            <div class="panel">
                <h3 id="formTitle">✍️ إضافة خبر جديد</h3>
                <input type="hidden" id="editingId" value="">
                
                <div class="form-group">
                    <label>اختر القسم:</label>
                    <div class="cat-buttons" id="catButtons">
                        <button class="cat-btn active" data-cat="politics" onclick="selectCat(this)">سياسة</button>
                        <button class="cat-btn" data-cat="society" onclick="selectCat(this)">مجتمع</button>
                        <button class="cat-btn" data-cat="economy" onclick="selectCat(this)">اقتصاد</button>
                        <button class="cat-btn" data-cat="literature" onclick="selectCat(this)">أدب</button>
                        <button class="cat-btn" data-cat="sports" onclick="selectCat(this)">رياضة</button>
                        <button class="cat-btn" data-cat="tech" onclick="selectCat(this)">تكنولوجيا</button>
                        <button class="cat-btn" data-cat="health" onclick="selectCat(this)">صحة</button>
                        <button class="cat-btn" data-cat="misc" onclick="selectCat(this)">منوعات</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>عنوان الخبر:</label>
                    <input type="text" id="newsTitle" placeholder="اكتب العنوان هنا...">
                </div>

                <div class="form-group">
                    <label>ملخص الخبر:</label>
                    <textarea id="newsSummary" placeholder="اكتب ملخصًا موجزًا..."></textarea>
                </div>

                <div class="form-group">
                    <label>محتوى الخبر الكامل:</label>
                    <div class="toolbar">
                        <button onclick="format('bold')"><b>B</b></button>
                        <button onclick="format('italic')"><i>I</i></button>
                        <button onclick="format('underline')"><u>U</u></button>
                        <button onclick="format('insertUnorderedList')">• قائمة</button>
                        <button onclick="format('insertOrderedList')">1. قائمة</button>
                        <button onclick="format('formatBlock', 'h3')">عنوان</button>
                        <button onclick="insertImage()">🖼️ صورة</button>
                        <button onclick="format('insertHorizontalRule')">—</button>
                    </div>
                    <div class="editor" id="editor" contenteditable="true"></div>
                </div>

                <div class="form-group">
                    <label>صورة الغلاف:</label>
                    <input type="text" id="coverImage" placeholder="ضع رابط الصورة هنا..." style="margin-bottom:10px;">
                    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                        <div class="icon">📤</div>
                        <p>اضغط لرفع صورة من جهازك</p>
                        <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="uploadImage()">
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="isBreaking" onchange="toggleBreakingFields()">
                        <label for="isBreaking">🔴 هذا خبر عاجل</label>
                    </div>
                </div>

                <div class="form-group" id="breakingTextGroup" style="display:none;">
                    <label>نص الخبر العاجل (للشريط المتحرك):</label>
                    <input type="text" id="breakingText" placeholder="مثال: انفجار في وسط بغداد.. القوات الأمنية تطوق المنطقة">
                </div>

                <div class="form-group">
                    <label>الدولة:</label>
                    <input type="text" id="country" placeholder="مثال: العراق">
                </div>
                <div class="form-group">
                    <label>المدينة:</label>
                    <input type="text" id="city" placeholder="مثال: بغداد">
                </div>
                <div class="form-group">
                    <label>تاريخ النشر:</label>
                    <input type="date" id="publishDate">
                </div>
                <div class="form-group">
                    <label>وقت النشر:</label>
                    <input type="time" id="publishTime">
                </div>

                <button class="btn-submit" onclick="submitNews()">🚀 نشر الخبر</button>
                <button class="btn-submit" style="background:#6c757d; margin-top:10px; display:none;" id="cancelEditBtn" onclick="cancelEdit()">إلغاء التعديل</button>
            </div>

            <!-- ===== قائمة الأخبار ===== -->
            <div class="panel">
                <h3>📋 الأخبار المنشورة</h3>
                <div id="newsListContainer">
                    <p class="loading">جاري التحميل...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== إعدادات Firebase =====
        const firebaseConfig = {
            apiKey: "AIzaSyAAp0nW8yCcI9hflpdZiLLiJkCS773qtog",
            authDomain: "iraqdot-news.firebaseapp.com",
            databaseURL: "https://iraqdot-news-default-rtdb.firebaseio.com",
            projectId: "iraqdot-news",
            storageBucket: "iraqdot-news.firebasestorage.app",
            messagingSenderId: "332644409269",
            appId: "1:332644409269:web:a3d9ffd2c7044d6fb803fc",
            measurementId: "G-M236VH0P44"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const VALID_TOKEN = 'iraqdot2025';
        let selectedCat = 'politics';
        let allNews = [];

        // ===== الاستماع للتغييرات =====
        database.ref('news').on('value', function(snapshot) {
            const data = snapshot.val();
            if (data) {
                allNews = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            } else {
                allNews = [];
            }
            renderList();
            updateStats();
            document.getElementById('dbStatus').textContent = '🟢 متصل';
            document.getElementById('dbStatus').style.color = '#198754';
        }, function(error) {
            document.getElementById('dbStatus').textContent = '🔴 خطأ';
            document.getElementById('dbStatus').style.color = '#dc3545';
        });

        function login() {
            const t = document.getElementById('tokenInput').value.trim();
            if (t === VALID_TOKEN) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                sessionStorage.setItem('iraqdot_admin', 'yes');
                document.getElementById('publishDate').value = new Date().toISOString().split('T')[0];
                document.getElementById('publishTime').value = new Date().toTimeString().slice(0,5);
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function logout() {
            sessionStorage.removeItem('iraqdot_admin');
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('tokenInput').value = '';
        }

        function selectCat(btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedCat = btn.dataset.cat;
        }

        function toggleBreakingFields() {
            const isChecked = document.getElementById('isBreaking').checked;
            document.getElementById('breakingTextGroup').style.display = isChecked ? 'block' : 'none';
        }

        function format(cmd, val) {
            document.execCommand(cmd, false, val || null);
            document.getElementById('editor').focus();
        }

        function insertImage() {
            const url = prompt('أدخل رابط الصورة:');
            if (url) document.execCommand('insertImage', false, url);
        }

        function uploadImage() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('coverImage').value = e.target.result;
                alert('✅ تم تحميل الصورة!');
            };
            reader.readAsDataURL(file);
        }

        function submitNews() {
            const editingId = document.getElementById('editingId').value;
            const title = document.getElementById('newsTitle').value.trim();
            const summary = document.getElementById('newsSummary').value.trim();
            const content = document.getElementById('editor').innerHTML;
            const cover = document.getElementById('coverImage').value.trim();
            const isBreaking = document.getElementById('isBreaking').checked;
            const breakingText = document.getElementById('breakingText').value.trim();
            const country = document.getElementById('country').value.trim();
            const city = document.getElementById('city').value.trim();
            const publishDate = document.getElementById('publishDate').value;
            const publishTime = document.getElementById('publishTime').value;

            if (!title) { alert('أدخل عنوان الخبر'); return; }
            if (!summary) { alert('أدخل ملخص الخبر'); return; }

            const newsData = {
                category: selectedCat,
                title: title,
                summary: summary,
                content: content,
                cover: cover || '',
                isBreaking: isBreaking,
                breakingText: isBreaking ? (breakingText || title) : '',
                country: country,
                city: city,
                date: publishDate || new Date().toISOString().split('T')[0],
                time: publishTime || new Date().toTimeString().slice(0,5),
                createdAt: new Date().toISOString()
            };

            if (editingId) {
                // تحديث خبر موجود
                database.ref('news/' + editingId).update(newsData)
                    .then(() => {
                        alert('✅ تم تحديث الخبر بنجاح!');
                        resetForm();
                    })
                    .catch(error => alert('❌ خطأ: ' + error.message));
            } else {
                // إضافة خبر جديد
                database.ref('news').push(newsData)
                    .then(() => {
                        alert('✅ تم نشر الخبر بنجاح!');
                        resetForm();
                    })
                    .catch(error => alert('❌ خطأ: ' + error.message));
            }
        }

        function editNews(id) {
            const article = allNews.find(n => n.id === id);
            if (!article) return;
            
            document.getElementById('editingId').value = id;
            document.getElementById('formTitle').textContent = '✏️ تعديل الخبر';
            
            // اختيار القسم
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.remove('active');
                if (b.dataset.cat === article.category) {
                    b.classList.add('active');
                    selectedCat = article.category;
                }
            });
            
            document.getElementById('newsTitle').value = article.title || '';
            document.getElementById('newsSummary').value = article.summary || '';
            document.getElementById('editor').innerHTML = article.content || '';
            document.getElementById('coverImage').value = article.cover || '';
            document.getElementById('isBreaking').checked = article.isBreaking || false;
            document.getElementById('breakingText').value = article.breakingText || '';
            toggleBreakingFields();
            document.getElementById('country').value = article.country || '';
            document.getElementById('city').value = article.city || '';
            document.getElementById('publishDate').value = article.date || '';
            document.getElementById('publishTime').value = article.time || '';
            
            document.getElementById('cancelEditBtn').style.display = 'block';
            document.querySelector('.panel').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelEdit() {
            resetForm();
        }

        function resetForm() {
            document.getElementById('editingId').value = '';
            document.getElementById('formTitle').textContent = '✍️ إضافة خبر جديد';
            document.getElementById('newsTitle').value = '';
            document.getElementById('newsSummary').value = '';
            document.getElementById('editor').innerHTML = '';
            document.getElementById('coverImage').value = '';
            document.getElementById('isBreaking').checked = false;
            document.getElementById('breakingText').value = '';
            document.getElementById('breakingTextGroup').style.display = 'none';
            document.getElementById('country').value = '';
            document.getElementById('city').value = '';
            document.getElementById('cancelEditBtn').style.display = 'none';
        }

        function deleteNews(id) {
            if (confirm('حذف هذا الخبر؟')) {
                database.ref('news/' + id).remove()
                    .then(() => alert('✅ تم الحذف بنجاح'))
                    .catch(error => alert('❌ خطأ: ' + error.message));
            }
        }

        function renderList() {
            const container = document.getElementById('newsListContainer');
            if (allNews.length === 0) {
                container.innerHTML = '<p class="loading">لا توجد أخبار بعد.</p>';
                return;
            }
            
            const catNames = {
                politics: 'سياسة', society: 'مجتمع', economy: 'اقتصاد',
                literature: 'أدب', sports: 'رياضة', tech: 'تكنولوجيا',
                health: 'صحة', misc: 'منوعات'
            };
            
            let html = '<ul class="news-list">';
            allNews.forEach(item => {
                const badge = item.isBreaking ? '<span class="badge-urgent">عاجل</span>' : '';
                html += `
                    <li class="news-item">
                        <div class="info">
                            <h4>${badge} ${item.title}</h4>
                            <span class="cat">${catNames[item.category] || item.category}</span>
                            <small style="display:block;color:#999;margin-top:3px;">${item.country || ''} ${item.city ? '- ' + item.city : ''} | ${item.date} ${item.time}</small>
                        </div>
                        <div class="actions">
                            <button class="btn-edit" onclick="editNews('${item.id}')">تعديل</button>
                            <button class="btn-del" onclick="deleteNews('${item.id}')">حذف</button>
                        </div>
                    </li>
                `;
            });
            html += '</ul>';
            container.innerHTML = html;
        }

        function updateStats() {
            document.getElementById('totalNews').textContent = allNews.length;
            const cats = new Set(allNews.map(n => n.category));
            document.getElementById('totalCats').textContent = cats.size;
        }

        if (sessionStorage.getItem('iraqdot_admin') === 'yes') {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('publishDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('publishTime').value = new Date().toTimeString().slice(0,5);
        }
    </script>
</body>
</html>
